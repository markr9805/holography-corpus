<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask the Corpus — Holography Corpus</title>
<style>
:root {
    --bg-primary: #0d1117;
    --bg-secondary: #161b22;
    --bg-tertiary: #21262d;
    --border: #30363d;
    --text-primary: #f0f6fc;
    --text-secondary: #c9d1d9;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --accent-hover: #79c0ff;
    --accent-dim: #1f6feb;
    --success: #3fb950;
    --warning: #d29922;
    --danger: #f85149;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-primary);
    color: var(--text-secondary);
    line-height: 1.6;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }
.container { max-width: 900px; margin: 0 auto; padding: 0 20px; }

nav.top-nav {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: 12px 0;
    position: sticky; top: 0; z-index: 100;
}
nav.top-nav .container { display: flex; align-items: center; justify-content: space-between; }
.nav-brand { font-weight: 700; color: var(--text-primary); font-size: 1.1em; }
.nav-links { display: flex; gap: 20px; }
.nav-links a { color: var(--text-muted); font-size: 0.9em; }
.nav-links a:hover { color: var(--accent); }

main { padding: 32px 0; }
h1 { color: var(--text-primary); font-size: 2em; margin-bottom: 8px; }
h2 { color: var(--text-primary); font-size: 1.3em; margin: 24px 0 12px; }
.subtitle { color: var(--text-muted); margin-bottom: 24px; }

.ask-box {
    background: var(--bg-secondary);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
}
.ask-box:focus-within { border-color: var(--accent); }

.ask-input-row { display: flex; gap: 12px; }
.ask-input {
    flex: 1;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--text-primary);
    font-size: 1em;
    font-family: inherit;
}
.ask-input:focus { outline: none; border-color: var(--accent); }
.ask-input::placeholder { color: var(--text-muted); }

.ask-btn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    font-size: 1em;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
}
.ask-btn:hover { background: var(--accent-hover); }
.ask-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.config-section {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 24px;
}
.config-section summary {
    cursor: pointer;
    color: var(--text-muted);
    font-size: 0.9em;
}
.config-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
}
.config-row label {
    color: var(--text-muted);
    font-size: 0.9em;
    min-width: 80px;
}
.config-row select, .config-row input {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    color: var(--text-primary);
    font-size: 0.9em;
}
.config-row select:focus, .config-row input:focus {
    outline: none;
    border-color: var(--accent);
}

.suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
}
.suggestion-btn {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    color: var(--text-secondary);
    font-size: 0.85em;
    cursor: pointer;
    transition: all 0.2s;
}
.suggestion-btn:hover { border-color: var(--accent); color: var(--accent); }

.answer-area { margin-top: 24px; }
.answer-box {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 16px;
}
.answer-text {
    color: var(--text-primary);
    line-height: 1.7;
}
.answer-text p { margin-bottom: 12px; }
.answer-text code {
    background: var(--bg-tertiary);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9em;
}

.status-msg {
    color: var(--text-muted);
    font-style: italic;
    padding: 20px;
    text-align: center;
}

.spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid var(--text-muted);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

.error-box {
    background: #f8514922;
    border: 1px solid var(--danger);
    border-radius: 8px;
    padding: 16px;
    color: var(--danger);
}

.passage-area { margin-top: 16px; }
.passage-card {
    background: var(--bg-tertiary);
    border-left: 3px solid var(--accent);
    padding: 12px 16px;
    margin-bottom: 8px;
    border-radius: 0 8px 8px 0;
}
.passage-header {
    font-size: 0.85em;
    color: var(--text-muted);
    margin-bottom: 4px;
}
.passage-text {
    color: var(--text-secondary);
    font-size: 0.95em;
    line-height: 1.5;
}
</style>
</head>
<body>
<nav class="top-nav">
    <div class="container">
        <a href="../index.html" class="nav-brand">🔬 Holography Corpus</a>
        <div class="nav-links">
            <a href="../creators/index.html">Creators</a>
            <a href="../forum/index.html">Forum</a>
            <a href="../search/index.html">Search</a>
            <a href="index.html" style="color:var(--accent)">Ask</a>
        </div>
    </div>
</nav>
<main class="container">
    <h1>🤖 Ask the Corpus</h1>
    <p class="subtitle">Ask questions about holography — answers are synthesized from video transcripts and forum discussions.</p>

    <div class="ask-box">
        <div class="ask-input-row">
            <input type="text" id="ask-input" class="ask-input" placeholder="Ask anything about holography..." autofocus>
            <button id="ask-btn" class="ask-btn" onclick="askQuestion()">Ask</button>
        </div>
        <div class="suggestions">
            <button class="suggestion-btn" onclick="askSuggestion(this)">How does dichromated gelatin (DCG) work?</button>
            <button class="suggestion-btn" onclick="askSuggestion(this)">What lasers are used for holography?</button>
            <button class="suggestion-btn" onclick="askSuggestion(this)">How do you make a reflection hologram?</button>
            <button class="suggestion-btn" onclick="askSuggestion(this)">What is the difference between transmission and reflection holograms?</button>
            <button class="suggestion-btn" onclick="askSuggestion(this)">What causes laser speckle?</button>
        </div>
    </div>

    <details class="config-section">
        <summary>⚙️ LLM Settings</summary>
        <div class="config-row">
            <label>Provider:</label>
            <select id="llm-provider">
                <option value="ollama">Ollama (local)</option>
                <option value="openai">OpenAI-compatible API</option>
                <option value="none">Search only (no LLM)</option>
            </select>
        </div>
        <div class="config-row">
            <label>Model:</label>
            <input type="text" id="llm-model" value="gemma3:27b" placeholder="e.g., gemma3:27b, llama3.1:8b">
        </div>
        <div class="config-row">
            <label>API URL:</label>
            <input type="text" id="llm-url" value="http://localhost:11434" placeholder="http://localhost:11434" style="flex:1">
        </div>
        <div class="config-row">
            <label>Passages:</label>
            <input type="number" id="num-passages" value="8" min="3" max="20" style="width:60px">
        </div>
    </details>

    <div id="answer-area" class="answer-area" style="display:none"></div>
</main>
<footer style="padding:24px 0;border-top:1px solid var(--border);margin-top:48px">
    <div class="container"><p style="color:var(--text-muted);font-size:0.85em">Holography Corpus · AI-powered search across video transcripts and forum discussions</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/lunr@2.3.9/lunr.min.js"></script>
<script>
let searchIndex = null;
let documents = [];
let forumIndex = null;
let forumDocs = [];

async function init() {
    const vResp = await fetch('../analysis/search-index.json');
    const vData = await vResp.json();
    documents = vData.entries || [];

    searchIndex = lunr(function() {
        this.ref('id');
        this.field('title', { boost: 10 });
        this.field('creator_name', { boost: 5 });
        this.field('excerpt');
        this.field('forum', { boost: 3 });
        this.field('authors', { boost: 3 });
        documents.forEach(doc => this.add(doc));
    });

    try {
        const fResp = await fetch('../analysis/forum-search-index.json');
        const fData = await fResp.json();
        forumDocs = fData.entries || [];
        forumIndex = lunr(function() {
            this.ref('id');
            this.field('title', { boost: 10 });
            this.field('forum', { boost: 3 });
            this.field('authors', { boost: 5 });
            this.field('excerpt');
            forumDocs.forEach(doc => this.add(doc));
        });
    } catch(e) {
        console.log('Forum index not available, skipping');
    }

    const params = new URLSearchParams(window.location.search);
    const q = params.get('q');
    if (q) {
        document.getElementById('ask-input').value = q;
        askQuestion();
    }
}

function askSuggestion(btn) {
    document.getElementById('ask-input').value = btn.textContent;
    askQuestion();
}

async function retrievePassages(query, numPassages) {
    const passages = [];

    try {
        const vResults = searchIndex.search(query);
        for (const r of vResults.slice(0, numPassages)) {
            const doc = documents.find(d => d.id === r.ref);
            if (!doc) continue;
            let fullText = doc.excerpt || '';
            if (doc.slug) {
                try {
                    const tResp = await fetch('../transcripts/' + doc.slug + '.json');
                    if (tResp.ok) {
                        const tData = await tResp.json();
                        for (const key of Object.keys(tData)) {
                            if (tData[key].text) {
                                fullText = tData[key].text.substring(0, 3000);
                                break;
                            }
                        }
                    }
                } catch(e) {}
            }
            passages.push({
                type: 'video',
                title: doc.title || 'Untitled Video',
                creator: doc.creator_name || '',
                date: doc.date || '',
                url: '../videos/' + doc.slug + '.html',
                excerpt: fullText.substring(0, 1500),
                score: r.score
            });
        }
    } catch(e) { console.error('Video search error:', e); }

    if (forumIndex) {
        try {
            const fResults = forumIndex.search(query);
            for (const r of fResults.slice(0, numPassages)) {
                const doc = forumDocs.find(d => d.id === r.ref);
                if (!doc) continue;
                passages.push({
                    type: 'forum',
                    title: doc.title || 'Untitled Topic',
                    forum: doc.forum_full || doc.forum || '',
                    authors: doc.authors || [],
                    date: (doc.date_start || '').substring(0, 10),
                    url: '../forum/' + doc.topic_id + '.html',
                    excerpt: (doc.excerpt || '').substring(0, 1500),
                    score: r.score
                });
            }
        } catch(e) { console.error('Forum search error:', e); }
    }

    passages.sort((a, b) => b.score - a.score);
    const seen = new Set();
    return passages.filter(p => {
        if (seen.has(p.title)) return false;
        seen.add(p.title);
        return true;
    }).slice(0, numPassages);
}

async function askQuestion() {
    const query = document.getElementById('ask-input').value.trim();
    if (!query) return;

    const btn = document.getElementById('ask-btn');
    const area = document.getElementById('answer-area');
    const numPassages = parseInt(document.getElementById('num-passages').value) || 8;
    const provider = document.getElementById('llm-provider').value;
    const model = document.getElementById('llm-model').value;
    const apiUrl = document.getElementById('llm-url').value;

    btn.disabled = true;
    btn.textContent = 'Searching...';
    area.style.display = 'block';
    area.innerHTML = '<div class="status-msg"><span class="spinner"></span>Searching the corpus for relevant passages...</div>';

    try {
        const passages = await retrievePassages(query, numPassages);

        if (passages.length === 0) {
            area.innerHTML = '<div class="error-box">No relevant passages found. Try different keywords.</div>';
            btn.disabled = false;
            btn.textContent = 'Ask';
            return;
        }

        let passagesHtml = '<h2>📚 Relevant Sources</h2><div class="passage-area">';
        for (const p of passages) {
            const icon = p.type === 'video' ? '📹' : '💬';
            const meta = p.type === 'video'
                ? p.creator + ' · ' + p.date
                : p.forum + ' · ' + p.authors.join(', ') + ' · ' + p.date;
            passagesHtml += '<div class="passage-card">' +
                '<div class="passage-header">' + icon + ' <a href="' + p.url + '">' + escHtml(p.title) + '</a> · ' + escHtml(meta) + '</div>' +
                '<div class="passage-text">' + escHtml(p.excerpt.substring(0, 500)) + (p.excerpt.length > 500 ? '…' : '') + '</div>' +
            '</div>';
        }
        passagesHtml += '</div>';

        if (provider === 'none') {
            area.innerHTML = passagesHtml;
            btn.disabled = false;
            btn.textContent = 'Ask';
            return;
        }

        area.innerHTML = passagesHtml + '<div class="status-msg"><span class="spinner"></span>Synthesizing answer with ' + escHtml(model) + '...</div>';

        const context = passages.map((p, i) => {
            const meta = p.type === 'video'
                ? '[Video: "' + p.title + '" by ' + p.creator + ', ' + p.date + ']'
                : '[Forum: "' + p.title + '" in ' + p.forum + ', by ' + p.authors.join(', ') + ', ' + p.date + ']';
            return 'Source ' + (i+1) + ': ' + meta + '
' + p.excerpt;
        }).join('

');

        const prompt = 'You are a holography expert assistant. Answer the following question based ONLY on the provided sources. Cite your sources using [Source N] notation. If the sources do not contain enough information, say so. Be specific and technical where the sources support it.

Question: ' + query + '

Sources:
' + context + '

Answer with citations:';

        let answer = '';
        if (provider === 'ollama') {
            const resp = await fetch(apiUrl + '/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: model,
                    prompt: prompt,
                    stream: false,
                    options: { temperature: 0.3, num_predict: 2048 }
                })
            });
            if (!resp.ok) throw new Error('Ollama API error: ' + resp.status + ' ' + await resp.text());
            const data = await resp.json();
            answer = data.response || '';
        } else if (provider === 'openai') {
            const resp = await fetch(apiUrl + '/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: model,
                    messages: [
                        { role: 'system', content: 'You are a holography expert assistant. Answer based only on provided sources. Cite sources as [Source N].' },
                        { role: 'user', content: prompt }
                    ],
                    temperature: 0.3,
                    max_tokens: 2048
                })
            });
            if (!resp.ok) throw new Error('API error: ' + resp.status + ' ' + await resp.text());
            const data = await resp.json();
            answer = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : '';
        }

        if (answer) {
            let formattedAnswer = escHtml(answer);
            formattedAnswer = formattedAnswer.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            passages.forEach((p, i) => {
                const re = new RegExp('\[Source ' + (i+1) + '\]', 'g');
                formattedAnswer = formattedAnswer.replace(re, '<a href="' + p.url + '" title="' + escHtml(p.title) + '">[Source ' + (i+1) + ']</a>');
            });
            formattedAnswer = formattedAnswer.replace(/

/g, '</p><p>');
            formattedAnswer = '<p>' + formattedAnswer + '</p>';

            area.innerHTML = '<div class="answer-box"><h2>💡 Answer</h2><div class="answer-text">' + formattedAnswer + '</div></div>' + passagesHtml;
        } else {
            area.innerHTML = passagesHtml + '<div class="error-box">LLM returned an empty response. Try a different model or check your settings.</div>';
        }

    } catch(e) {
        area.innerHTML = '<div class="error-box">Error: ' + escHtml(e.message) + '</div>';
    }

    btn.disabled = false;
    btn.textContent = 'Ask';
}

function escHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

document.getElementById('ask-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') askQuestion();
});

init();
</script>
</body>
</html>
